<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Game Chiến Đấu</title>
  <style>
    body { 
      background: black; 
      color: white; 
      font-family: monospace; 
      text-align: center; 
      margin-top: 50px;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>⚔️ Game Chiến Đấu</h1>
  <p id="status">Bắt đầu trận chiến!</p>
  <button onclick="attack()">Tấn công</button>
  <button onclick="heal()">Hồi máu</button>

  <script>
    let playerHP = 100;
    let enemyHP = 100;

    function updateStatus() {
      document.getElementById("status").innerHTML = `
        💪 Người chơi: ${playerHP} HP <br>
        👹 Quái vật: ${enemyHP} HP
      `;
    }

    function attack() {
      let dmg = Math.floor(Math.random() * 20) + 5;
      enemyHP -= dmg;
      if (enemyHP <= 0) {
        alert("🎉 Bạn đã thắng!");
        enemyHP = 100; playerHP = 100;
      } else {
        enemyAttack();
      }
      updateStatus();
    }

    function heal() {
      let heal = Math.floor(Math.random() * 15) + 5;
      playerHP += heal;
      if (playerHP > 100) playerHP = 100;
      enemyAttack();
      updateStatus();
    }

    function enemyAttack() {
      let dmg = Math.floor(Math.random() * 15) + 5;
      playerHP -= dmg;
      if (playerHP <= 0) {
        alert("💀 Bạn đã thua...");
        playerHP = 100; enemyHP = 100;
      }
    }

    updateStatus();
  </script>
</body>
</html>
